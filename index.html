<style>
:root{
  --bg:#07070a;
  --surface:rgba(255,255,255,0.04);
  --surface-hi:rgba(255,255,255,0.07);
  --border:rgba(255,255,255,0.08);
  --border-hi:rgba(255,255,255,0.18);
  --text:#f4f4f6;
  --text-dim:#a8a8b3;
  --muted:#6c6c78;
  --accent:#7c5cff;
  --accent-2:#a78bfa;
  --glow:rgba(124,92,255,0.4);
  --ease:cubic-bezier(.2,.8,.2,1);
}

*,*::before,*::after{margin:0;padding:0;box-sizing:border-box}
html{-webkit-text-size-adjust:100%}

body{
  min-height:100vh;
  display:flex;
  align-items:center;
  justify-content:center;
  font-family:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  font-size:16px;
  color:var(--text);
  background:var(--bg);
  overflow-x:hidden;
  padding:40px 20px;
  -webkit-font-smoothing:antialiased;
  position:relative;
}

/* фон: мягкое свечение сверху + снизу */
body::before{
  content:'';
  position:fixed;
  top:-40%;
  left:50%;
  transform:translateX(-50%);
  width:1100px;
  height:1100px;
  background:radial-gradient(circle, rgba(124,92,255,0.18) 0%, transparent 60%);
  filter:blur(60px);
  pointer-events:none;
  z-index:0;
}
body::after{
  content:'';
  position:fixed;
  bottom:-50%;
  right:-15%;
  width:900px;
  height:900px;
  background:radial-gradient(circle, rgba(80,200,255,0.08) 0%, transparent 65%);
  filter:blur(80px);
  pointer-events:none;
  z-index:0;
}

/* лёгкая точечная текстура */
.noise{
  position:fixed;
  inset:0;
  pointer-events:none;
  z-index:1;
  opacity:0.035;
  background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
}

/* контейнер */
.hub{
  position:relative;
  z-index:2;
  width:100%;
  max-width:440px;
  display:flex;
  flex-direction:column;
  gap:12px;
  animation:fadeUp 0.9s var(--ease) both;
}

@keyframes fadeUp{
  from{opacity:0;transform:translateY(20px)}
  to{opacity:1;transform:translateY(0)}
}

/* заголовок */
.hub-title{
  text-align:center;
  font-size:15px;
  font-weight:500;
  letter-spacing:0.02em;
  color:var(--text-dim);
  margin-bottom:32px;
  text-transform:lowercase;
}

/* карточка ссылки */
.card{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:16px;
  padding:20px 24px;
  border-radius:16px;
  text-decoration:none;
  color:var(--text);
  background:var(--surface);
  border:1px solid var(--border);
  position:relative;
  overflow:hidden;
  transition:
    transform 0.35s var(--ease),
    border-color 0.35s var(--ease),
    background 0.35s var(--ease),
    box-shadow 0.35s var(--ease);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  animation:fadeUp 0.9s var(--ease) both;
}
.card:nth-child(2){animation-delay:0.08s}
.card:nth-child(3){animation-delay:0.16s}
.card:nth-child(4){animation-delay:0.24s}
.card:nth-child(5){animation-delay:0.32s}

.card::before{
  content:'';
  position:absolute;
  inset:0;
  background:linear-gradient(90deg, transparent 0%, rgba(124,92,255,0.08) 50%, transparent 100%);
  transform:translateX(-100%);
  transition:transform 0.7s var(--ease);
  pointer-events:none;
}
.card:hover::before{
  transform:translateX(100%);
}
.card:hover{
  transform:translateY(-2px);
  border-color:var(--border-hi);
  background:var(--surface-hi);
  box-shadow:
    0 12px 40px rgba(0,0,0,0.4),
    0 0 0 1px rgba(124,92,255,0.15),
    0 0 60px rgba(124,92,255,0.12);
}
.card:active{
  transform:translateY(0);
}

/* тонкая цветная полоска слева */
.card .stripe{
  position:absolute;
  left:0;
  top:20%;
  bottom:20%;
  width:2px;
  border-radius:2px;
  background:var(--accent);
  opacity:0.9;
  transition:all 0.35s var(--ease);
}
.card:hover .stripe{
  top:0;
  bottom:0;
  box-shadow:0 0 20px var(--glow);
}
.card.s1 .stripe{background:linear-gradient(180deg,#7c5cff,#a78bfa)}
.card.s2 .stripe{background:linear-gradient(180deg,#c9ff3d,#7cffb2)}
.card.s3 .stripe{background:linear-gradient(180deg,#7cd4ff,#7c5cff)}

.card-title{
  font-size:16px;
  font-weight:500;
  letter-spacing:-0.01em;
  color:var(--text);
  padding-left:8px;
}

.card-text{
  display:flex;
  flex-direction:column;
  gap:2px;
  flex:1;
  min-width:0;
}
.card-desc{
  font-size:12.5px;
  font-weight:400;
  line-height:1.35;
  color:var(--muted);
  padding-left:8px;
}

.card-arrow{
  display:flex;
  align-items:center;
  justify-content:center;
  width:28px;
  height:28px;
  border-radius:50%;
  background:rgba(255,255,255,0.05);
  border:1px solid var(--border);
  font-size:13px;
  color:var(--muted);
  flex-shrink:0;
  transition:all 0.35s var(--ease);
}
.card:hover .card-arrow{
  color:var(--text);
  background:rgba(124,92,255,0.15);
  border-color:rgba(124,92,255,0.4);
  transform:translateX(4px);
  box-shadow:0 0 20px rgba(124,92,255,0.2);
}

/* нижняя подпись */
.sign{
  text-align:center;
  font-size:12px;
  color:var(--muted);
  margin-top:36px;
  letter-spacing:0.03em;
  animation:fadeUp 0.9s var(--ease) 0.35s both;
}
.sign .heart{
  color:var(--accent-2);
  display:inline-block;
  animation:beat 2.4s ease-in-out infinite;
}
@keyframes beat{
  0%,100%{transform:scale(1)}
  20%{transform:scale(1.2)}
  40%{transform:scale(1)}
}

/* мобильные */
@media (max-width:480px){
  body{padding:32px 16px}
  .hub{gap:10px}
  .card{padding:18px 20px;border-radius:14px}
  .card-title{font-size:15px}
  .card-arrow{width:26px;height:26px;font-size:12px}
  .hub-title{margin-bottom:24px;font-size:14px}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:0.01ms !important;
    transition-duration:0.01ms !important;
  }
}
</style>
</head>

<div class="noise" aria-hidden="true"></div>

<div class="hub">

  <div class="hub-title">кто это сделал?</div>

  <a href="https://rasp.whpp.site/" class="card s1" target="_blank" rel="noopener">
    <span class="stripe"></span>
    <span class="card-text"><span class="card-title">Расписание</span><span class="card-desc">Расписание занятий: недели и подгруппы</span></span>
    <span class="card-arrow">→</span>
  </a>

  <a href="https://drive.whpp.site/" class="card s2" target="_blank" rel="noopener">
    <span class="stripe"></span>
    <span class="card-text"><span class="card-title">AirDrive</span><span class="card-desc">Бесплатное облачное хранилище файлов</span></span>
    <span class="card-arrow">→</span>
  </a>

  <a href="https://form.whpp.site/" class="card s2" target="_blank" rel="noopener">
    <span class="stripe"></span>
    <span class="card-text"><span class="card-title">Formatter</span><span class="card-desc">Оформление документов по ГОСТ за пару кликов</span></span>
    <span class="card-arrow">→</span>
  </a>

  <a href="https://tools.whpp.site/" class="card s3" target="_blank" rel="noopener">
    <span class="stripe"></span>
    <span class="card-text"><span class="card-title">WHPP Tools</span><span class="card-desc">36 онлайн-инструментов для файлов, текста и кода</span></span>
    <span class="card-arrow">→</span>
  </a>


  <div class="sign">
    made with <span class="heart">💜</span> by me
  </div>

</div>

</body>
</html>
